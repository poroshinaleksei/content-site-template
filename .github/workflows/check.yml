name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Smoke test generator
        run: |
          target="$(mktemp -d)/generated-site"
          printf 'Smoke Site\nSmoke Owner\nrussian\nenglish\nSmoke Norwegian description.\nSmoke English description.\nhttps://example.com\nsmall-business\nnordic-warm\nhello@example.com\n\n\n\n\n\n' | node scripts/generate-site.mjs "$target" --skip-install --skip-check
          test -f "$target/package.json"
          test -f "$target/brief.md"
